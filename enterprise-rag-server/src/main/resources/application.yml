server:
  port: 8080

spring:
  application:
    name: enterprise-rag-backend

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB

  datasource:
    url: jdbc:mysql://localhost:3306/enterprise_rag_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
    username: ${mysql_username}
    password: ${mysql_password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 3000ms

  sql:
    init:
      mode: always
      schema-locations: classpath:db/init.sql

  mail:
    host: smtp.qq.com
    port: 587
    username: ${email_username}
    password: ${email_password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

jwt:
  access-token:
    secret: ${JWT_ACCESS_SECRET:your-access-token-secret-key-at-least-256-bits-long-for-hs256}
    expiration: 1800000
  refresh-token:
    secret: ${JWT_REFRESH_SECRET:your-refresh-token-secret-key-at-least-256-bits-long-for-hs256}
    expiration: 604800000

aliyun:
  oss:
    enabled: ${OSS_ENABLED:false}
    endpoint: ${OSS_ENDPOINT:}
    region: ${OSS_REGION:}
    bucket: ${OSS_BUCKET:}
    object-prefix: ${OSS_OBJECT_PREFIX:enterprise-rag}
    signed-url-expiration-minutes: ${OSS_SIGNED_URL_EXPIRATION_MINUTES:10}

rag:
  vectorization:
    enabled: ${RAG_VECTORIZATION_ENABLED:false}
    batch-size: ${RAG_VECTORIZATION_BATCH_SIZE:16}
  chat:
    enabled: ${RAG_CHAT_ENABLED:false}
    minimum-evidence-score: ${RAG_CHAT_MINIMUM_EVIDENCE_SCORE:0.0}
    max-question-characters: ${RAG_CHAT_MAX_QUESTION_CHARACTERS:2000}
    max-history-messages: ${RAG_CHAT_MAX_HISTORY_MESSAGES:6}
    delta-chunk-size: ${RAG_CHAT_DELTA_CHUNK_SIZE:24}
    refusal-text: ${RAG_CHAT_REFUSAL_TEXT:当前知识库中没有足够的可靠依据回答该问题，请补充信息或联系相关负责人确认。}
    model:
      endpoint: ${CHAT_MODEL_ENDPOINT:}
      api-key: ${CHAT_MODEL_API_KEY:}
      model: ${CHAT_MODEL:}
      temperature: ${CHAT_MODEL_TEMPERATURE:0.1}
      max-tokens: ${CHAT_MODEL_MAX_TOKENS:1500}
      request-timeout-millis: ${CHAT_MODEL_REQUEST_TIMEOUT_MILLIS:120000}
      max-attempts: ${CHAT_MODEL_MAX_ATTEMPTS:2}
  retrieval:
    dense-top-k: ${RAG_RETRIEVAL_DENSE_TOP_K:30}
    sparse-top-k: ${RAG_RETRIEVAL_SPARSE_TOP_K:30}
    fusion-top-k: ${RAG_RETRIEVAL_FUSION_TOP_K:20}
    rrf-k: ${RAG_RETRIEVAL_RRF_K:60}
    rerank-top-k: ${RAG_RETRIEVAL_RERANK_TOP_K:8}
    context-max-characters: ${RAG_RETRIEVAL_CONTEXT_MAX_CHARACTERS:12000}
    max-sources-per-document: ${RAG_RETRIEVAL_MAX_SOURCES_PER_DOCUMENT:2}
  rerank:
    model-enabled: ${RERANK_MODEL_ENABLED:false}
    endpoint: ${RERANK_ENDPOINT:}
    api-key: ${RERANK_API_KEY:}
    model: ${RERANK_MODEL:qwen3-vl-rerank}
    instruct: ${RERANK_INSTRUCT:Given a web search query, retrieve relevant passages that answer the query.}
    fallback-enabled: ${RERANK_FALLBACK_ENABLED:true}
    connect-timeout-millis: ${RERANK_CONNECT_TIMEOUT_MILLIS:5000}
    request-timeout-millis: ${RERANK_REQUEST_TIMEOUT_MILLIS:60000}
    max-attempts: ${RERANK_MAX_ATTEMPTS:3}
    retry-delay-millis: ${RERANK_RETRY_DELAY_MILLIS:500}
  embedding:
    endpoint: ${EMBEDDING_ENDPOINT:}
    api-key: ${EMBEDDING_API_KEY:}
    model: ${EMBEDDING_MODEL:}
    dimensions: ${EMBEDDING_DIMENSIONS:1024}
    send-dimensions: ${EMBEDDING_SEND_DIMENSIONS:false}
    request-timeout-millis: ${EMBEDDING_REQUEST_TIMEOUT_MILLIS:60000}
    max-attempts: ${EMBEDDING_MAX_ATTEMPTS:3}
  milvus:
    uri: ${MILVUS_URI:http://localhost:19530}
    token: ${MILVUS_TOKEN:}
    database-name: ${MILVUS_DATABASE:default}
    collection-name: ${MILVUS_COLLECTION:enterprise_rag_chunks}
