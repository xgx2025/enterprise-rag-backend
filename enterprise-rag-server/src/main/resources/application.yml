server:
  port: 8080

spring:
  application:
    name: enterprise-rag-backend

  datasource:
    url: jdbc:mysql://localhost:3306/enterprise_rag_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
    username: ${mysql_username}
    password: ${mysql_password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 3000ms

  sql:
    init:
      mode: always
      schema-locations: classpath:db/init.sql

  mail:
    host: smtp.qq.com
    port: 587
    username: ${email_username}
    password: ${email_password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

jwt:
  access-token:
    secret: ${JWT_ACCESS_SECRET:your-access-token-secret-key-at-least-256-bits-long-for-hs256}
    expiration: 1800000
  refresh-token:
    secret: ${JWT_REFRESH_SECRET:your-refresh-token-secret-key-at-least-256-bits-long-for-hs256}
    expiration: 604800000
